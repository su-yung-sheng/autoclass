<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 視覺檢核 - 第一關 LED矩陣 自我練習</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        .score-pop { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        .bg-gradient-edu { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); }
    </style>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
          apiKey: "AIzaSyB-BwDBWaAMM7_-dHQui78cntZ4fi_ydxY",
          authDomain: "colabprogram-c8014.firebaseapp.com",
          projectId: "colabprogram-c8014",
          storageBucket: "colabprogram-c8014.firebasestorage.app",
          messagingSenderId: "900230173526",
          appId: "1:900230173526:web:4d176bea3f637c30b33cf7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.fbInstances = { auth, db, doc, onSnapshot, signInAnonymously, onAuthStateChanged };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body class="bg-gradient-edu min-h-screen flex items-center justify-center p-4 text-slate-800 font-sans">
    <div id="root" class="w-full h-full max-w-[1200px] flex items-center justify-center"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const App = () => {
            const TARGET_CLASS_CODE = 'yssu'; 
            // 🌟 鎖定第一關
            const TARGET_TASK = '1.8x8 LED矩陣'; 

            const [backendUrl, setBackendUrl] = useState('https://flanking-snort-cyclic.ngrok-free.dev'); 
            const [backendStatus, setBackendStatus] = useState('checking'); 
            const [firebaseReady, setFirebaseReady] = useState(!!window.fbInstances);
            const [user, setUser] = useState(null);
            const [cloudSyncStatus, setCloudSyncStatus] = useState('connecting'); 
            
            const [videoFile, setVideoFile] = useState(null);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [status, setStatus] = useState('idle'); 
            const [progressInfo, setProgressInfo] = useState({ current: 0, total: 0, percent: 0 });
            const [errorMessage, setErrorMessage] = useState('');
            const [queueMsg, setQueueMsg] = useState(''); 

            const [templatePool, setTemplatePool] = useState([]); 
            const [bestMatchResult, setBestMatchResult] = useState(null); 
            const [analysisEngine, setAnalysisEngine] = useState('ocr'); 
            const [strictMode, setStrictMode] = useState(true);
            const [stateSensitivity, setStateSensitivity] = useState(3.0);   
            const [roi, setRoi] = useState({ x: 50, y: 50, w: 150, h: 100 });
            
            const [videoInfo, setVideoInfo] = useState({ width: 1, height: 1 });
            const [config, setConfig] = useState({ invertColor: true });
            
            const videoRef = useRef(null);
            const abortControllerRef = useRef(null);
            const fileInputRef = useRef(null); 

            useEffect(() => {
                const handleFbReady = () => setFirebaseReady(true);
                window.addEventListener('firebase-ready', handleFbReady);
                return () => window.removeEventListener('firebase-ready', handleFbReady);
            }, []);

            useEffect(() => {
                if (!firebaseReady) return;
                const { auth, signInAnonymously, onAuthStateChanged } = window.fbInstances;
                signInAnonymously(auth).catch(err => console.error("連線準備失敗:", err));
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, [firebaseReady]);

            useEffect(() => {
                if (!user || !firebaseReady) return;
                const { db, doc, onSnapshot } = window.fbInstances;
                
                const taskRef = doc(db, 'VisionClassrooms', TARGET_CLASS_CODE, 'Tasks', TARGET_TASK);
                setCloudSyncStatus('connecting');

                const unsubscribe = onSnapshot(taskRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        let parsedTemplates = [];
                        if (data.templates && Array.isArray(data.templates)) {
                            parsedTemplates = data.templates.map(t => {
                                try { return typeof t === 'string' ? JSON.parse(t) : t; } 
                                catch (e) { return t; }
                            });
                        }
                        setTemplatePool(parsedTemplates);
                        setAnalysisEngine(data.engine || 'ocr');
                        if (data.sensitivity) setStateSensitivity(data.sensitivity);
                        if (data.roi) setRoi(data.roi);
                        if (data.strictMode !== undefined) {
                            setStrictMode(data.strictMode);
                        } else {
                            setStrictMode(true);
                        }
                        if (data.config) setConfig(data.config);
                        
                        setCloudSyncStatus(parsedTemplates.length > 0 ? 'synced' : 'no-template');
                    } else {
                        setCloudSyncStatus('no-template');
                        setTemplatePool([]);
                    }
                }, (error) => {
                    setCloudSyncStatus('error');
                });
                return () => unsubscribe();
            }, [user, firebaseReady]);

            const updateVideoDimensions = () => {
                if (videoRef.current && videoRef.current.videoWidth) {
                    setVideoInfo({ width: videoRef.current.videoWidth, height: videoRef.current.videoHeight });
                }
            };
            useEffect(() => {
                window.addEventListener('resize', updateVideoDimensions);
                return () => window.removeEventListener('resize', updateVideoDimensions);
            }, []);

            useEffect(() => {
                let interval;
                const checkConnection = async () => {
                    if (!backendUrl) return;
                    try {
                        let cleanUrl = backendUrl.trim();
                        if (!cleanUrl.startsWith('http')) cleanUrl = 'https://' + cleanUrl;
                        const res = await fetch(`${cleanUrl.replace(/\/$/, '')}/api/analyze-video`, { 
                            method: 'GET', headers: { 'ngrok-skip-browser-warning': 'true' }
                        });
                        if (res.ok || res.status === 405 || res.status === 404 || res.status === 422) {
                            setBackendStatus('online');
                        } else {
                            setBackendStatus('offline');
                        }
                    } catch (error) { setBackendStatus('offline'); }
                };
                
                if (status !== 'analyzing' && status !== 'queued') {
                    checkConnection(); 
                    interval = setInterval(checkConnection, 10000); 
                }
                return () => { if (interval) clearInterval(interval); };
            }, [backendUrl, status]);

            // 🌟 升級：與教師端 V6 100% 完全同步的智慧批改演算法
            const calculateBestMatch = (studentSeq) => {
                if (templatePool.length === 0) return null;
                let bestMatch = { score: -1, matched: 0, extra: 0, totalSteps: 0, templateIndex: 0 };
                
                templatePool.forEach((templateSeq, index) => {
                    if (!Array.isArray(templateSeq)) return;
                    let matched = 0; let extra = 0;
                    
                    if (strictMode) {
                        for (let i = 0; i < studentSeq.length; i++) {
                            if (i < templateSeq.length) {
                                const sVal = String(studentSeq[i]).trim();
                                const tVal = String(templateSeq[i]).trim();
                                
                                if (sVal.startsWith('狀態變更') && tVal.startsWith('狀態變更')) {
                                    const sMatch = sVal.match(/[\d.]+/);
                                    const tMatch = tVal.match(/[\d.]+/);
                                    if (sMatch && tMatch) {
                                        const sRatio = parseFloat(sMatch[0]);
                                        const tRatio = parseFloat(tMatch[0]);
                                        // 允許 35% 面積誤差
                                        if (Math.abs(sRatio - tRatio) <= 35) {
                                            matched++;
                                        } else {
                                            extra++;
                                        }
                                    } else {
                                        matched++;
                                    }
                                } else {
                                    // 🌟 自動去雜訊空白
                                    const cleanStudentStr = sVal.replace(/\s+/g, '');
                                    const cleanTemplateStr = tVal.replace(/\s+/g, '');
                                    if (cleanStudentStr === cleanTemplateStr) matched++;
                                    else extra++;
                                }
                            } else {
                                extra++;
                            }
                        }
                    } else {
                        matched = Math.min(studentSeq.length, templateSeq.length);
                        extra = Math.max(0, studentSeq.length - templateSeq.length);
                    }
                    
                    let baseScore = templateSeq.length > 0 ? Math.round((matched / templateSeq.length) * 100) : 100;
                    let penalty = extra * 10;
                    let finalScore = Math.max(0, baseScore - penalty);
                    if (finalScore > bestMatch.score) {
                        bestMatch = { score: finalScore, matched, extra, templateIndex: index + 1, totalSteps: templateSeq.length };
                    }
                });
                return bestMatch.score === -1 ? null : bestMatch;
            };

            const getFeedbackMessage = (score) => {
                if (score >= 90) return { text: "🎉 太棒了！完美執行！", color: "text-emerald-600", bg: "bg-emerald-100" };
                if (score >= 75) return { text: "💪 再加油一點點，快成功了！", color: "text-blue-600", bg: "bg-blue-100" };
                return { text: "🤔 系統比對不符，請檢查程式邏輯或確認錄影時綠框有沒有對準呢？", color: "text-amber-600", bg: "bg-amber-100" };
            };

            const handleReset = () => {
                setStatus('idle');
                setVideoFile(null);
                setPreviewUrl(null);
                setBestMatchResult(null);
                setProgressInfo({ current: 0, total: 0, percent: 0 });
                setQueueMsg('');
                if (fileInputRef.current) {
                    fileInputRef.current.value = ''; 
                }
            };

            const startAnalysis = async () => {
                if (!videoFile || !backendUrl) return;
                if (videoFile.size > 50 * 1024 * 1024) {
                    setErrorMessage("影片檔案過大 (超過 50MB)，請先剪短一點再上傳喔！");
                    setStatus('error');
                    return;
                }
                
                let localTaskStatus = 'connecting';
                setStatus('connecting');
                setErrorMessage('');
                setProgressInfo({ current: 0, total: 0, percent: 0 });
                setBestMatchResult(null);
                setQueueMsg('');

                let lastTextValue = null;
                let lastRatioValue = null;
                let studentCurrentSeq = []; 

                if (abortControllerRef.current) abortControllerRef.current.abort();
                abortControllerRef.current = new AbortController();

                try {
                    const formData = new FormData();
                    formData.append('file', videoFile);
                    formData.append('roi', JSON.stringify(roi));
                    formData.append('config', JSON.stringify(config));
                    formData.append('engine', analysisEngine);

                    let cleanUrl = backendUrl.trim();
                    if (!cleanUrl.startsWith('http')) cleanUrl = 'https://' + cleanUrl;
                    
                    const response = await fetch(`${cleanUrl.replace(/\/$/, '')}/api/analyze-video`, {
                        method: 'POST',
                        body: formData,
                        signal: abortControllerRef.current.signal,
                    });

                    if (!response.ok) throw new Error("伺服器很忙碌，請稍後再試。");
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.trim()) continue;
                            try {
                                const data = JSON.parse(line);
                                if (data.error) throw new Error("運算發生錯誤");
                                
                                if (data.status === 'queued') {
                                    localTaskStatus = 'queued';
                                    setStatus('queued');
                                    setQueueMsg(data.message);
                                    continue;
                                }
                                
                                if (data.status === 'processing') {
                                    localTaskStatus = 'analyzing';
                                    setStatus('analyzing');
                                    setQueueMsg('');
                                    continue;
                                }

                                if (data.progress !== undefined) {
                                    setProgressInfo({ current: data.current_time || 0, total: data.total_duration || 0, percent: data.progress });
                                }
                                
                                if (data.status === 'finished') {
                                    localTaskStatus = 'success';
                                    setStatus('success');
                                    const best = calculateBestMatch(studentCurrentSeq);
                                    setBestMatchResult(best);
                                    break;
                                }

                                const currentText = data.text || "";
                                const currentRatio = data.pixel_ratio !== undefined ? data.pixel_ratio : null;
                                let isTriggered = false;
                                let milestoneValue = "";

                                if (analysisEngine === 'motion' && currentRatio !== null) {
                                    let isMoving = currentRatio >= stateSensitivity;
                                    let currentStateStr = isMoving ? "旋轉中" : "靜止";
                                    if (lastRatioValue === null) {
                                        lastRatioValue = currentStateStr;
                                    } else if (lastRatioValue !== currentStateStr) {
                                        isTriggered = true;
                                        milestoneValue = `馬達狀態:${currentStateStr}`;
                                        lastRatioValue = currentStateStr;
                                    }
                                }
                                else if (analysisEngine === 'state' && currentRatio !== null) {
                                    if (lastRatioValue === null) {
                                        lastRatioValue = currentRatio;
                                    } else {
                                        const delta = Math.abs(currentRatio - lastRatioValue);
                                        if (delta >= stateSensitivity) {
                                            isTriggered = true;
                                            milestoneValue = `狀態變更(充填率:${currentRatio}%)`;
                                            lastRatioValue = currentRatio;
                                        }
                                    }
                                } 
                                else if ((analysisEngine === 'ocr' || analysisEngine === 'color') && currentText) {
                                    if (currentText !== lastTextValue) {
                                        isTriggered = true;
                                        milestoneValue = currentText;
                                        lastTextValue = currentText;
                                    }
                                }

                                if (isTriggered) {
                                    let actualValueToStore = milestoneValue;
                                    if (strictMode && (analysisEngine === 'ocr' || analysisEngine === 'color')) {
                                        actualValueToStore = currentText;
                                    }
                                    studentCurrentSeq.push(actualValueToStore);
                                }
                            } catch (e) {
                                console.error("解析異常");
                            }
                        }
                    }
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        setErrorMessage("網路不穩或是處理超時了，請換個短一點的影片再試一次！");
                        localTaskStatus = 'error';
                        setStatus('error');
                    } else { 
                        localTaskStatus = 'idle';
                        setStatus('idle'); 
                    }
                } finally {
                    abortControllerRef.current = null;
                    if (localTaskStatus !== 'success' && localTaskStatus !== 'error' && localTaskStatus !== 'queued' && localTaskStatus !== 'analyzing') {
                        setStatus('idle');
                    }
                }
            };

            return (
                <div className="w-full max-w-4xl bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden flex flex-col md:flex-row h-[85vh] md:h-[600px]">
                    
                    <div className="w-full md:w-5/12 p-6 flex flex-col bg-slate-50 border-r border-slate-100">
                        <div className="mb-6 text-center md:text-left">
                            <h1 className="text-2xl font-black text-emerald-600 tracking-wide mb-1">AI 魔法檢核鏡</h1>
                            <h2 className="text-sm font-bold text-slate-500">當前挑戰任務：<span className="text-indigo-600">{TARGET_TASK}</span></h2>
                        </div>

                        <div className="flex justify-center md:justify-start gap-2 mb-6 text-[10px] font-bold">
                            <span className={`px-2 py-0.5 rounded-full border transition-colors ${backendStatus === 'online' ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-rose-100 text-rose-700 border-rose-200'}`}>
                                核心: {backendStatus === 'online' ? '就緒' : '離線'}
                            </span>
                            <span className={`px-2 py-0.5 rounded-full border transition-colors ${cloudSyncStatus === 'synced' ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-amber-100 text-amber-700 border-amber-200'}`}>
                                雲端: {cloudSyncStatus === 'synced' ? '已連接' : '等待中'}
                            </span>
                        </div>

                        <div className="flex-1 flex flex-col justify-center">
                            {cloudSyncStatus === 'no-template' ? (
                                <div className="bg-rose-50 p-4 rounded-2xl border border-rose-200 text-center animate-fadeIn">
                                    <div className="text-rose-500 mb-2 flex justify-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                                    </div>
                                    <p className="text-sm font-bold text-rose-800">老師還沒準備好此關卡喔！</p>
                                </div>
                            ) : (
                                <div className={`transition-all ${status === 'analyzing' || status === 'queued' || status === 'success' ? 'opacity-50 pointer-events-none' : ''}`}>
                                    <label className="block text-sm font-bold text-slate-700 mb-2 text-center md:text-left">上傳你的實作影片</label>
                                    
                                    <label className="relative border-2 border-dashed border-emerald-300 rounded-2xl bg-white hover:bg-emerald-50 transition-colors p-8 text-center cursor-pointer group shadow-sm block">
                                        
                                        <input 
                                            type="file" 
                                            ref={fileInputRef} 
                                            disabled={status === 'analyzing' || status === 'queued' || status === 'success'}
                                            onChange={(e) => {
                                                if(e.target.files[0]){
                                                    setVideoFile(e.target.files[0]);
                                                    setPreviewUrl(URL.createObjectURL(e.target.files[0]));
                                                    setStatus('idle'); setErrorMessage(''); setBestMatchResult(null);
                                                }
                                            }} 
                                            accept=".mp4,.mov,.m4v,.avi,.webm,video/mp4" 
                                            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10 disabled:cursor-not-allowed"
                                        />
                                        
                                        <div className="text-emerald-500 group-hover:scale-110 transition-transform duration-300 flex justify-center pointer-events-none">
                                            {videoFile ? (
                                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mb-2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
                                            ) : (
                                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mb-2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                                            )}
                                        </div>
                                        <span className="text-xs font-bold text-emerald-600 block mt-2 px-4 truncate pointer-events-none">
                                            {videoFile ? videoFile.name : '點擊選擇檔案'}
                                        </span>
                                    </label>
                                </div>
                            )}

                            {errorMessage && <div className="mt-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-xl font-bold animate-fadeIn text-center">{errorMessage}</div>}
                        </div>

                        <div className="mt-6">
                            {status === 'queued' && (
                                <div className="mb-4 animate-fadeIn">
                                    <div className="flex justify-between text-xs font-bold text-amber-600 mb-1.5">
                                        <span>{queueMsg}</span>
                                    </div>
                                    <div className="w-full bg-amber-100 rounded-full h-3 overflow-hidden shadow-inner">
                                        <div className="bg-amber-400 h-3 rounded-full transition-all duration-300 relative w-full">
                                            <div className="absolute inset-0 bg-white/30 animate-[progress_2s_linear_infinite] w-full h-full" style={{backgroundImage: 'linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent)', backgroundSize: '1rem 1rem'}}></div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        
                            {status === 'analyzing' && (
                                <div className="mb-4 animate-fadeIn">
                                    <div className="flex justify-between text-xs font-bold text-slate-500 mb-1">
                                        <span>AI 解析中，請稍候...</span><span>{progressInfo.percent}%</span>
                                    </div>
                                    <div className="w-full bg-slate-200 rounded-full h-3 overflow-hidden shadow-inner">
                                        <div className="bg-emerald-500 h-3 rounded-full transition-all duration-300 relative" style={{width: `${progressInfo.percent}%`}}>
                                            <div className="absolute inset-0 bg-white/20 animate-pulse w-full h-full"></div>
                                        </div>
                                    </div>
                                </div>
                            )}
                            
                            <button 
                                onClick={(status === 'analyzing' || status === 'queued') ? () => abortControllerRef.current && abortControllerRef.current.abort() : startAnalysis} 
                                disabled={!previewUrl || cloudSyncStatus !== 'synced' || backendStatus !== 'online' || status === 'success'}
                                className={`w-full py-4 rounded-2xl font-black text-sm tracking-widest shadow-md transition-all flex items-center justify-center gap-2 ${
                                    !previewUrl || cloudSyncStatus !== 'synced' || backendStatus !== 'online' || status === 'success' ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 
                                    status === 'connecting' ? 'bg-slate-400 text-white cursor-wait' : 
                                    status === 'queued' ? 'bg-amber-100 text-amber-700 border border-amber-300 hover:bg-amber-200' :
                                    status === 'analyzing' ? 'bg-rose-100 text-rose-600 border border-rose-200 hover:bg-rose-200' :
                                    'bg-gradient-to-r from-emerald-500 to-teal-500 text-white hover:scale-[1.02] hover:shadow-lg'
                                }`}
                            >
                                {status === 'connecting' ? '召喚 AI 中...' : 
                                 status === 'queued' ? '🛑 取消排隊' :
                                 status === 'analyzing' ? '🛑 中斷解析' : 
                                 status === 'success' ? '請先完成檢核並重置畫面' :
                                 backendStatus !== 'online' ? '伺服器未準備好' :
                                 cloudSyncStatus !== 'synced' ? '等待關卡資料...' :
                                 '🚀 看看我拿幾分！'}
                            </button>
                        </div>
                    </div>

                    <div className="w-full md:w-7/12 flex flex-col bg-slate-900 relative">
                        <div className="flex-1 relative flex items-center justify-center p-4">
                            {!previewUrl ? (
                                <div className="text-slate-600 font-bold tracking-widest text-sm opacity-50 flex flex-col items-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="mb-4"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                                    等待影片載入
                                </div>
                            ) : (
                                <div className="relative flex items-center justify-center max-w-full max-h-full inline-flex leading-none shadow-2xl rounded-xl overflow-hidden">
                                    <video ref={videoRef} src={previewUrl} controls className="max-w-full max-h-[40vh] md:max-h-full object-contain" onLoadedMetadata={updateVideoDimensions}></video>
                                    {videoInfo.width > 1 && (
                                        <div className="absolute inset-0 pointer-events-none select-none">
                                            <div 
                                                className={`absolute border-[3px] border-emerald-400 bg-emerald-400/10 shadow-[0_0_12px_rgba(52,211,129,0.5)] transition-all ${status === 'analyzing' || status === 'queued' ? 'opacity-30' : ''}`}
                                                style={{ left: `${(roi.x / videoInfo.width) * 100}%`, top: `${(roi.y / videoInfo.height) * 100}%`, width: `${(roi.w / videoInfo.width) * 100}%`, height: `${(roi.h / videoInfo.height) * 100}%` }}
                                            >
                                                <div className="absolute top-1 right-1 text-white text-[9px] font-mono bg-emerald-600 px-1.5 py-0.5 rounded shadow font-bold">AI 掃描區</div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className={`absolute bottom-0 left-0 w-full transition-transform duration-500 ease-out bg-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.2)] flex flex-col p-6 z-10 ${status === 'success' && bestMatchResult ? 'translate-y-0 h-[60%]' : 'translate-y-full h-0 opacity-0 pointer-events-none'}`}>
                            {bestMatchResult && (
                                <div className="flex-1 flex flex-col items-center justify-center score-pop text-center space-y-2">
                                    <div className="text-slate-400 font-bold text-xs uppercase tracking-widest border-b border-slate-100 pb-2 w-full max-w-xs">自我檢核報告</div>
                                    <div className="text-[10px] font-bold text-slate-400 text-center uppercase tracking-wider mb-2">
                                        經過與 {templatePool.length} 組老師範本庫比對
                                    </div>
                                    
                                    <div className="flex items-end justify-center gap-1 my-1">
                                        <span className={`text-8xl font-black tracking-tighter drop-shadow-sm ${bestMatchResult.score >= 80 ? 'text-emerald-500' : bestMatchResult.score >= 60 ? 'text-blue-500' : 'text-rose-500'}`}>
                                            {bestMatchResult.score}
                                        </span>
                                    </div>
                                    <div className={`px-6 py-2.5 rounded-full font-black text-sm shadow-sm border ${getFeedbackMessage(bestMatchResult.score).bg} ${getFeedbackMessage(bestMatchResult.score).color} border-current/20`}>
                                        {getFeedbackMessage(bestMatchResult.score).text}
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4 w-full mt-5 max-w-xs">
                                        <div className="bg-slate-50 py-3 px-2 rounded-2xl border border-slate-100 shadow-inner">
                                            <div className="text-[10px] text-slate-400 font-bold mb-1">✅ 成功動作</div>
                                            <div className="text-xl font-black text-emerald-600">{bestMatchResult.matched}</div>
                                        </div>
                                        <div className="bg-slate-50 py-3 px-2 rounded-2xl border border-slate-100 shadow-inner">
                                            <div className="text-[10px] text-slate-400 font-bold mb-1">⚠️ 錯誤或多餘</div>
                                            <div className="text-xl font-black text-rose-600">{bestMatchResult.extra}</div>
                                        </div>
                                    </div>
                                    
                                    <button onClick={handleReset} className="mt-5 text-[11px] font-bold text-slate-500 hover:text-slate-700 transition-colors px-5 py-2.5 bg-slate-100 rounded-lg shadow-sm border border-slate-200 hover:bg-slate-200">
                                        完成檢核並清空畫面
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
