    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* 🌟 核心修復：限制捲軸樣式只套用於內部區塊，不影響 body 全域，解決排版偏移問題 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        .score-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #10b981; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- GAS 輔助連線函式 ---
        const GAS_URL = "https://script.google.com/a/macros/mail.qfm.kh.edu.tw/s/AKfycbydRpN2hbYelUy9sAvTYh26JlK_DBpA5NrAN-jmepXRjG4oBnGy4TTT2NWktLK4JdzSyA/exec";
        let jsonpCounter = 0;
        const fetchJSONP = (url) => {
            return new Promise((resolve, reject) => {
                const callbackName = 'jsonp_cb_' + Date.now() + '_' + (jsonpCounter++);
                const script = document.createElement('script');
                const timeoutId = setTimeout(() => { cleanup(); reject(new Error("伺服器請求超時！")); }, 30000);
                function cleanup() { delete window[callbackName]; if (script.parentNode) document.body.removeChild(script); }
                window[callbackName] = function(data) { clearTimeout(timeoutId); cleanup(); resolve(data); };
                const sep = url.includes('?') ? '&' : '?';
                script.src = `${url}${sep}callback=${callbackName}`;
                script.onerror = function() { clearTimeout(timeoutId); cleanup(); reject(new Error("網路連線失敗。")); };
                document.body.appendChild(script);
            });
        };

        const App = () => {
            const [appMode, setAppMode] = useState('student');
            const [analysisEngine, setAnalysisEngine] = useState('state'); 
            const [backendUrl, setBackendUrl] = useState('https://flanking-snort-cyclic.ngrok-free.dev'); 
            
            const [backendStatus, setBackendStatus] = useState('checking'); 
            const [firebaseReady, setFirebaseReady] = useState(!!window.fbInstances);
            const [user, setUser] = useState(null);
            const [cloudSyncStatus, setCloudSyncStatus] = useState('connecting'); 
            
            const defaultTasks = ['1.8x8 LED矩陣', '2.LED 燈條', '3.直流减速馬達'];
            const [classCode, setClassCode] = useState('yssu'); 
            const [taskList, setTaskList] = useState(defaultTasks); 
            const [currentTask, setCurrentTask] = useState(defaultTasks[0]); 
            const [isAddingTask, setIsAddingTask] = useState(false);
            const [newTaskName, setNewTaskName] = useState('');

            const [showScoreModal, setShowScoreModal] = useState(false);
            const [queryClass, setQueryClass] = useState('');
            const [classScores, setClassScores] = useState([]);
            const [isQuerying, setIsQuerying] = useState(false); 
            const [showClearConfirm, setShowClearConfirm] = useState(false); 

            const [studentId, setStudentId] = useState('');

            const [videoFile, setVideoFile] = useState(null);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [status, setStatus] = useState('idle'); 
            const [resultHistory, setResultHistory] = useState([]);
            const [progressInfo, setProgressInfo] = useState({ current: 0, total: 0, percent: 0 });
            const [errorMessage, setErrorMessage] = useState('');
            const [queueMsg, setQueueMsg] = useState(''); 

            const [templatePool, setTemplatePool] = useState([]); 
            const [studentSequence, setStudentSequence] = useState([]); 
            const [bestMatchResult, setBestMatchResult] = useState(null); 
            const [strictMode, setStrictMode] = useState(true);
            const [stateSensitivity, setStateSensitivity] = useState(3.0);   

            const [roi, setRoi] = useState({ x: 50, y: 50, w: 150, h: 100 });
            const [videoInfo, setVideoInfo] = useState({ width: 1, height: 1 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragType, setDragType] = useState(null);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0, roiX: 0, roiY: 0, roiW: 0, roiH: 0 });
            const [config, setConfig] = useState({ invertColor: true }); 
            
            // 🌟 Classroom 整合狀態
            const [showGasModal, setShowGasModal] = useState(false);
            const [gasStep, setGasStep] = useState('courses'); 
            const [gasCourses, setGasCourses] = useState([]);
            const [gasAssignments, setGasAssignments] = useState([]);
            const [gasCurrentCourse, setGasCurrentCourse] = useState(null);
            const [gasCurrentAssignment, setGasCurrentAssignment] = useState(null);
            const [gasLoading, setGasLoading] = useState(false);
            const [gasLoadingText, setGasLoadingText] = useState('');
            const [classroomSubmissions, setClassroomSubmissions] = useState([]);
            const [currentSubmissionIndex, setCurrentSubmissionIndex] = useState(-1);
            const [writeBackScore, setWriteBackScore] = useState(true);
            const [gasIntent, setGasIntent] = useState('load_videos');

            const videoRef = useRef(null);
            const abortControllerRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const handleFbReady = () => setFirebaseReady(true);
                window.addEventListener('firebase-ready', handleFbReady);
                return () => window.removeEventListener('firebase-ready', handleFbReady);
            }, []);

            useEffect(() => {
                if (!firebaseReady) return;
                const { auth, signInAnonymously, onAuthStateChanged } = window.fbInstances;
                signInAnonymously(auth).catch(err => console.error("登入失敗:", err));
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, [firebaseReady]);

            useEffect(() => {
                if (!user || !firebaseReady || !classCode.trim()) return;
                const { db, doc, onSnapshot } = window.fbInstances;
                const classRef = doc(db, 'VisionClassrooms', classCode.trim());
                
                const unsubscribe = onSnapshot(classRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const fetchedTasks = data.tasks || [];
                        const mergedTasks = Array.from(new Set([...defaultTasks, ...fetchedTasks]));
                        setTaskList(mergedTasks);
                        setCurrentTask(prev => (!prev || !mergedTasks.includes(prev)) ? mergedTasks[0] : prev);
                    } else {
                        setTaskList(defaultTasks);
                        setCurrentTask(prev => (!prev || !defaultTasks.includes(prev)) ? defaultTasks[0] : prev);
                    }
                });
                return () => unsubscribe();
            }, [user, firebaseReady, classCode]);

            useEffect(() => {
                if (!user || !firebaseReady || !classCode.trim() || !currentTask) {
                    setTemplatePool([]); setCloudSyncStatus('no-template'); return;
                }
                const { db, doc, onSnapshot } = window.fbInstances;
                const taskRef = doc(db, 'VisionClassrooms', classCode.trim(), 'Tasks', currentTask);
                setCloudSyncStatus('connecting');

                const unsubscribe = onSnapshot(taskRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        let parsedTemplates = [];
                        if (data.templates && Array.isArray(data.templates)) {
                            parsedTemplates = data.templates.map(t => typeof t === 'string' ? JSON.parse(t) : t);
                        }
                        setTemplatePool(parsedTemplates);
                        setAnalysisEngine(data.engine || 'state');
                        if (data.sensitivity) setStateSensitivity(data.sensitivity);
                        if (data.roi) setRoi(data.roi);
                        if (data.strictMode !== undefined) setStrictMode(data.strictMode);
                        if (data.config) setConfig(data.config); 
                        setCloudSyncStatus(parsedTemplates.length > 0 ? 'synced' : 'no-template');
                    } else {
                        setCloudSyncStatus('no-template'); setTemplatePool([]);
                    }
                });
                return () => unsubscribe();
            }, [user, firebaseReady, classCode, currentTask]);

            const loadGasCourses = async () => {
                setShowGasModal(true); setGasStep('courses'); setGasLoading(true); setGasLoadingText("正在讀取 Classroom 課程清單...");
                try {
                    const data = await fetchJSONP(`${GAS_URL}?action=getCourses`);
                    if(data.status === 'error') throw new Error(data.message);
                    setGasCourses(data.courses || []);
                } catch (err) { alert("課程讀取失敗: " + err.message); } finally { setGasLoading(false); }
            };

            const loadGasAssignments = async (course) => {
                setGasCurrentCourse(course); setGasStep('assignments'); setGasLoading(true); setGasLoadingText(`正在讀取「${course.name}」的作業清單...`);
                try {
                    const data = await fetchJSONP(`${GAS_URL}?action=getAssignments&courseId=${course.id}`);
                    if(data.status === 'error') throw new Error(data.message);
                    setGasAssignments(data.assignments || []);
                } catch (err) { alert("作業讀取失敗: " + err.message); } finally { setGasLoading(false); }
            };

            const loadGasSubmissions = async (assignment) => {
                setGasCurrentAssignment(assignment);
                setGasLoading(true);
                setGasLoadingText(gasIntent === 'batch_sync' ? "正在提取 Classroom 名單以進行同步..." : "正在提取影片繳交名單與歷史成績...");
                
                try {
                    const data = await fetchJSONP(`${GAS_URL}?action=getSubmissions&courseId=${gasCurrentCourse.id}&courseWorkId=${assignment.id}`);
                    if(data.status === 'error') throw new Error(data.message);
                    
                    const allFiles = data.files || [];

                    if (gasIntent === 'batch_sync') {
                        let syncCount = 0;
                        const processedSubs = new Set(); 

                        for (const f of allFiles) {
                            if (processedSubs.has(f.submissionId)) continue;
                            
                            let sid = null;
                            const match = f.name.match(/\d{7}/);
                            if (match) sid = match[0];
                            else { 
                                const b = f.name.split('.').slice(0, -1).join('.'); 
                                sid = b.replace(/\D/g, '').substring(0, 7) || b.substring(0, 7); 
                            }

                            if (sid) {
                                const scoreRecord = classScores.find(s => s.studentId === sid);
                                if (scoreRecord && scoreRecord.score !== undefined) {
                                    setGasLoadingText(`同步中: 學號 ${sid} ➡️ ${scoreRecord.score}分...`);
                                    try {
                                        await fetchJSONP(`${GAS_URL}?action=updateScore&courseId=${gasCurrentCourse.id}&courseWorkId=${assignment.id}&submissionId=${f.submissionId}&score=${scoreRecord.score}`);
                                        syncCount++;
                                        processedSubs.add(f.submissionId);
                                    } catch (e) {
                                        console.error("同步失敗:", sid, e);
                                    }
                                }
                            }
                        }
                        
                        alert(`🎉 批次同步完成！共成功同步 ${syncCount} 位學生的成績至 Classroom。`);
                        setShowGasModal(false);
                        setGasIntent('load_videos');
                        setGasLoading(false);
                        return; 
                    }
                    
                    const videos = allFiles.filter(f => /\.(mp4|mov|webm|avi)$/i.test(f.name));
                    
                    videos.sort((a, b) => {
                        const numA = a.name.match(/\d+/) ? parseInt(a.name.match(/\d+/)[0], 10) : 99999;
                        const numB = b.name.match(/\d+/) ? parseInt(b.name.match(/\d+/)[0], 10) : 99999;
                        if (numA !== numB) return numA - numB;
                        return a.name.localeCompare(b.name, 'zh-TW');
                    });

                    if (window.fbInstances && user) {
                        const { db, doc, getDoc } = window.fbInstances;
                        const fetchPromises = videos.map(async (v) => {
                            let sid = null;
                            const match = v.name.match(/\d{7}/);
                            if (match) sid = match[0];
                            else { 
                                const b = v.name.split('.').slice(0, -1).join('.'); 
                                sid = b.replace(/\D/g, '').substring(0, 7) || b.substring(0, 7); 
                            }
                            
                            if (sid) {
                                const parsed = parseStudentId(sid);
                                if (parsed) {
                                    try {
                                        const scoreRef = doc(db, 'VisionClassrooms', classCode.trim(), 'Scores', `${currentTask}_${parsed.className}_${parsed.number}`);
                                        const snap = await getDoc(scoreRef);
                                        if (snap.exists() && snap.data().score !== undefined) {
                                            v.score = snap.data().score;
                                        }
                                    } catch (fbError) {
                                        console.warn("無法取得歷史成績:", fbError);
                                    }
                                }
                            }
                            return v;
                        });
                        await Promise.all(fetchPromises);
                    }

                    setClassroomSubmissions(videos);
                    setCurrentSubmissionIndex(-1);
                    setShowGasModal(false);
                    if (videos.length === 0) alert("此作業中找不到任何學生繳交的影片檔案。");
                } catch (err) {
                    alert("名單載入失敗: " + err.message);
                } finally { setGasLoading(false); }
            };

            const loadStudentVideo = async (sub, idx) => {
                setCurrentSubmissionIndex(idx);
                setStatus('connecting');
                setErrorMessage('');
                setResultHistory([]); setBestMatchResult(null); setPreviewUrl(null); setVideoFile(null);
                
                const match = sub.name.match(/\d{7}/);
                if (match) setStudentId(match[0]);
                else { const b = sub.name.split('.').slice(0, -1).join('.'); setStudentId(b.replace(/\D/g, '').substring(0, 7) || b.substring(0, 7)); }

                try {
                    const tokenRes = await fetchJSONP(`${GAS_URL}?action=getToken`);
                    if (tokenRes.status === 'error' || !tokenRes.token) throw new Error("取得 Classroom 授權 Token 失敗，請點擊上方授權按鈕。");
                    
                    const fileUrl = `https://www.googleapis.com/drive/v3/files/${sub.id}?alt=media`;
                    const res = await fetch(fileUrl, { headers: { 'Authorization': 'Bearer ' + tokenRes.token } });
                    if (!res.ok) throw new Error(`Google API 拒絕存取 (${res.status})`);
                    
                    const blob = await res.blob();
                    const videoFileObj = new File([blob], sub.name, { type: blob.type || "video/mp4" });
                    
                    setVideoFile(videoFileObj);
                    if (previewUrl) URL.revokeObjectURL(previewUrl);
                    setPreviewUrl(URL.createObjectURL(blob));
                    setStatus('idle');
                } catch(e) {
                    setErrorMessage("載入串流影片失敗: " + e.message);
                    setStatus('error');
                }
            };

            const handleManualUpload = (e) => {
                if(e.target.files[0]){
                    const file = e.target.files[0];
                    setVideoFile(file); setPreviewUrl(URL.createObjectURL(file));
                    setStatus('idle'); setResultHistory([]); setErrorMessage(''); setBestMatchResult(null); setStudentSequence([]); setQueueMsg('');
                    setCurrentSubmissionIndex(-1);
                    if (appMode === 'student') {
                        const match = file.name.match(/\d{7}/);
                        if (match) setStudentId(match[0]);
                        else { const b = file.name.split('.').slice(0, -1).join('.'); setStudentId(b.replace(/\D/g, '').substring(0, 7) || b.substring(0, 7)); }
                    }
                }
            };

            const parseStudentId = (id) => {
                if (!id || id.length !== 7) return null;
                const clsStr = id.substring(3, 5); 
                const numStr = id.substring(5, 7); 
                return { className: `7${clsStr}`, number: numStr };
            };

            const handleAddTask = async () => {
                if (!newTaskName.trim() || !classCode.trim()) return;
                try {
                    const { db, doc, setDoc } = window.fbInstances;
                    const classRef = doc(db, 'VisionClassrooms', classCode.trim());
                    const newTasks = [...taskList, newTaskName.trim()];
                    await setDoc(classRef, { tasks: newTasks }, { merge: true });
                    setCurrentTask(newTaskName.trim());
                    setNewTaskName(''); setIsAddingTask(false);
                } catch (err) { alert("新增關卡失敗: " + err.message); }
            };

            const handleModeSwitch = (mode) => {
                if (mode === 'student' && templatePool.length === 0) {
                    alert("雲端範本庫目前為空！請先在「教師模式」錄製並新增至少一組標準。"); return;
                }
                setAppMode(mode); setVideoFile(null); setPreviewUrl(null); setStatus('idle');
                setResultHistory([]); setStudentSequence([]); setBestMatchResult(null); setStudentId('');
                setClassroomSubmissions([]); setCurrentSubmissionIndex(-1);
                if (fileInputRef.current) fileInputRef.current.value = '';
                if (videoRef.current) videoRef.current.src = "";
            };

            const clearTemplatePool = async () => {
                try {
                    const { db, doc, setDoc } = window.fbInstances;
                    const taskRef = doc(db, 'VisionClassrooms', classCode.trim(), 'Tasks', currentTask);
                    await setDoc(taskRef, { templates: [], engine: analysisEngine, roi: roi, config: config }, { merge: true });
                    setShowClearConfirm(false);
                    alert("🗑️ 範本庫已成功清空！");
                } catch (err) { alert("清空失敗：" + err.message); }
            };

            const saveSettingsOnly = async () => {
                try {
                    const { db, doc, setDoc } = window.fbInstances;
                    const taskRef = doc(db, 'VisionClassrooms', classCode.trim(), 'Tasks', currentTask);
                    
                    await setDoc(taskRef, {
                        engine: analysisEngine,
                        sensitivity: stateSensitivity,
                        strictMode: strictMode,
                        config: config,
                        roi: roi,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                    
                    alert(`✅ 已成功更新「${currentTask}」的評分原則與綠框！\n無須重新建檔，學生端將立刻套用新標準。`);
                } catch (err) {
                    console.error("更新設定失敗", err);
                    alert("更新設定失敗：" + err.message);
                }
            };

            const handleQueryScores = async () => {
                if (!queryClass) { alert("請先選擇要查詢的班級！"); return; }
                
                setClassScores([]); 
                setIsQuerying(true);

                try {
                    const { db, collection, getDocs } = window.fbInstances;
                    const scoresRef = collection(db, 'VisionClassrooms', classCode.trim(), 'Scores');
                    const snap = await getDocs(scoresRef);
                    let results = [];
                    snap.forEach(docSnap => {
                        const data = docSnap.data();
                        if (docSnap.id.startsWith(`${currentTask}_${queryClass}_`)) {
                            results.push(data);
                        }
                    });
                    results.sort((a, b) => parseInt(a.number) - parseInt(b.number));
                    setClassScores(results);
                } catch(e) { 
                    console.error("查詢失敗", e); 
                    alert("讀取成績失敗"); 
                } finally {
                    setIsQuerying(false);
                }
            };

            const saveStudentScore = async (finalScore) => {
                if (appMode !== 'student' || !window.fbInstances || !user) return;
                
                const parsed = parseStudentId(studentId);
                let isNewHighScore = true; 

                if (parsed) {
                    try {
                        const { db, doc, getDoc, setDoc } = window.fbInstances;
                        const scoreRef = doc(db, 'VisionClassrooms', classCode.trim(), 'Scores', `${currentTask}_${parsed.className}_${parsed.number}`);
                        
                        const docSnap = await getDoc(scoreRef);
                        let shouldSave = true;
                        if (docSnap.exists()) {
                            const oldScore = docSnap.data().score || 0;
                            if (finalScore <= oldScore) {
                                shouldSave = false;
                                isNewHighScore = false; 
                            }
                        }

                        if (shouldSave) {
                            await setDoc(scoreRef, {
                                studentId: studentId,
                                className: parsed.className,
                                number: parsed.number,
                                score: finalScore,
                                updatedAt: new Date().toISOString()
                            }, { merge: true });
                        }
                    } catch (e) { console.error("成績寫入 Firebase 失敗", e); }
                }

                if (classroomSubmissions.length > 0 && currentSubmissionIndex !== -1) {
                    const newSubs = [...classroomSubmissions];
                    const currentRecordScore = newSubs[currentSubmissionIndex].score;
                    
                    if (currentRecordScore === undefined || finalScore > currentRecordScore) {
                        newSubs[currentSubmissionIndex].score = finalScore;
                        setClassroomSubmissions(newSubs);
                        isNewHighScore = true;
                    } else {
                        isNewHighScore = false;
                    }

                    if (writeBackScore && isNewHighScore) {
                        const sub = newSubs[currentSubmissionIndex];
                        if (sub.submissionId && gasCurrentCourse && gasCurrentAssignment) {
                            try {
                                await fetchJSONP(`${GAS_URL}?action=updateScore&courseId=${gasCurrentCourse.id}&courseWorkId=${gasCurrentAssignment.id}&submissionId=${sub.submissionId}&score=${finalScore}`);
                            } catch (e) { console.error("Classroom 成績同步失敗:", e); }
                        }
                    }
                }
            };

            const updateVideoDimensions = () => {
                if (videoRef.current && videoRef.current.videoWidth) {
                    setVideoInfo({ width: videoRef.current.videoWidth, height: videoRef.current.videoHeight });
                }
            };
            useEffect(() => { window.addEventListener('resize', updateVideoDimensions); return () => window.removeEventListener('resize', updateVideoDimensions); }, []);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!isDragging || !videoRef.current || appMode === 'student') return;
                    const videoRect = videoRef.current.getBoundingClientRect();
                    const scaleX = videoInfo.width / videoRect.width;
                    const scaleY = videoInfo.height / videoRect.height;
                    const deltaX = (e.clientX - dragStart.x) * scaleX;
                    const deltaY = (e.clientY - dragStart.y) * scaleY;

                    if (dragType === 'move') {
                        let newX = Math.max(0, Math.min(Math.round(dragStart.roiX + deltaX), videoInfo.width - dragStart.roiW));
                        let newY = Math.max(0, Math.min(Math.round(dragStart.roiY + deltaY), videoInfo.height - dragStart.roiH));
                        setRoi(prev => ({ ...prev, x: newX, y: newY }));
                    } else if (dragType === 'resize') {
                        let newW = Math.max(20, Math.min(Math.round(dragStart.roiW + deltaX), videoInfo.width - dragStart.roiX));
                        let newH = Math.max(20, Math.min(Math.round(dragStart.roiH + deltaY), videoInfo.height - dragStart.roiY));
                        setRoi(prev => ({ ...prev, w: newW, h: newH }));
                    }
                };
                const handleMouseUp = () => setIsDragging(false);
                if (isDragging) { document.addEventListener('mousemove', handleMouseMove); document.addEventListener('mouseup', handleMouseUp); }
                return () => { document.removeEventListener('mousemove', handleMouseMove); document.removeEventListener('mouseup', handleMouseUp); };
            }, [isDragging, dragType, dragStart, videoInfo, appMode]);

            const handleMouseDown = (e, type) => {
                if (appMode === 'student') return; 
                e.preventDefault(); e.stopPropagation();
                setIsDragging(true); setDragType(type);
                setDragStart({ x: e.clientX, y: e.clientY, roiX: roi.x, roiY: roi.y, roiW: roi.w, roiH: roi.h });
            };

            useEffect(() => {
                let interval;
                const checkConnection = async () => {
                    if (!backendUrl) return;
                    try {
                        let cleanUrl = backendUrl.trim();
                        if (!cleanUrl.startsWith('http')) cleanUrl = 'https://' + cleanUrl;
                        const res = await fetch(`${cleanUrl.replace(/\/$/, '')}/api/analyze-video`, { 
                            method: 'GET', headers: { 'ngrok-skip-browser-warning': 'true' }
                        });
                        if (res.ok || res.status === 405 || res.status === 404 || res.status === 422) setBackendStatus('online');
                        else setBackendStatus('offline');
                    } catch (error) { setBackendStatus('offline'); }
                };
                if (status !== 'analyzing' && status !== 'queued') { checkConnection(); interval = setInterval(checkConnection, 10000); }
                return () => { if (interval) clearInterval(interval); };
            }, [backendUrl, status]);

            const calculateBestMatch = (studentSeq) => {
                if (templatePool.length === 0) return null;
                let bestMatch = { score: -1, matched: 0, extra: 0, templateIndex: 0, totalSteps: 0 };
                
                templatePool.forEach((templateSeq, index) => {
                    if (!Array.isArray(templateSeq)) return;
                    let matched = 0; let extra = 0;
                    
                    for (let i = 0; i < studentSeq.length; i++) {
                        if (i < templateSeq.length) {
                            const sVal = String(studentSeq[i]).trim();
                            const tVal = String(templateSeq[i]).trim();
                            
                            if (sVal.startsWith('狀態變更') && tVal.startsWith('狀態變更')) {
                                const sMatch = sVal.match(/[\d.]+/);
                                const tMatch = tVal.match(/[\d.]+/);
                                if (sMatch && tMatch) {
                                    const sRatio = parseFloat(sMatch[0]);
                                    const tRatio = parseFloat(tMatch[0]);
                                    if (Math.abs(sRatio - tRatio) <= 35) {
                                        matched++;
                                    } else {
                                        extra++;
                                    }
                                } else {
                                    matched++;
                                }
                            } 
                            else {
                                if (strictMode) {
                                    const cleanStudentStr = sVal.replace(/\s+/g, '');
                                    const cleanTemplateStr = tVal.replace(/\s+/g, '');
                                    if (cleanStudentStr === cleanTemplateStr) matched++;
                                    else extra++;
                                } else {
                                    matched++;
                                }
                            }
                        } else {
                            extra++;
                        }
                    }
                    
                    let baseScore = templateSeq.length > 0 ? Math.round((matched / templateSeq.length) * 100) : 100;
                    let penalty = extra * 10;
                    let finalScore = Math.max(0, baseScore - penalty);
                    if (finalScore > bestMatch.score) {
                        bestMatch = { score: finalScore, matched, extra, templateIndex: index + 1, totalSteps: templateSeq.length };
                    }
                });
                return bestMatch.score === -1 ? null : bestMatch;
            };

            const handleResetUI = () => {
                setStatus('idle'); 
                setBestMatchResult(null); setProgressInfo({ current: 0, total: 0, percent: 0 });
                setResultHistory([]); setStudentSequence([]); setQueueMsg('');
                
                if (appMode === 'student' && classroomSubmissions.length > 0 && currentSubmissionIndex !== -1) {
                    if (currentSubmissionIndex < classroomSubmissions.length - 1) {
                        loadStudentVideo(classroomSubmissions[currentSubmissionIndex + 1], currentSubmissionIndex + 1);
                    } else {
                        alert("這已經是最後一位學生了！");
                        setVideoFile(null); setPreviewUrl(null); 
                    }
                } else {
                    setVideoFile(null); setPreviewUrl(null); 
                    if (fileInputRef.current) fileInputRef.current.value = ''; 
                }
            };

            const startAnalysis = async () => {
                if (!videoFile || !backendUrl || !currentTask) return;
                if (appMode === 'student' && (!studentId || studentId.length !== 7 || !parseStudentId(studentId))) {
                    setErrorMessage("請輸入正確的 7 碼學號！(影片檔名中若無學號，請手動輸入)"); setStatus('error'); return;
                }
                if (videoFile.size > 50 * 1024 * 1024) {
                    setErrorMessage("影片過大 (超過 50MB)，請剪輯後再上傳。"); setStatus('error'); return;
                }
                
                let localTaskStatus = 'connecting';
                setStatus('connecting'); setResultHistory([]); setErrorMessage(''); 
                setProgressInfo({ current: 0, total: 0, percent: 0 }); setStudentSequence([]);
                setBestMatchResult(null); setQueueMsg('');

                let lastTextValue = null; 
                let lastRatioValue = null;
                let historyList = []; let studentCurrentSeq = []; 

                if (abortControllerRef.current) abortControllerRef.current.abort();
                abortControllerRef.current = new AbortController();

                try {
                    const formData = new FormData();
                    formData.append('file', videoFile);
                    formData.append('roi', JSON.stringify(roi));
                    formData.append('config', JSON.stringify(config));
                    formData.append('engine', analysisEngine);

                    let cleanUrl = backendUrl.trim();
                    if (!cleanUrl.startsWith('http')) cleanUrl = 'https://' + cleanUrl;
                    const response = await fetch(`${cleanUrl.replace(/\/$/, '')}/api/analyze-video`, {
                        method: 'POST', body: formData, signal: abortControllerRef.current.signal,
                    });

                    if (!response.ok) throw new Error("伺服器回應異常，請稍後再試。");
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.trim()) continue;
                            try {
                                const data = JSON.parse(line);
                                if (data.error) throw new Error(data.error);
                                
                                if (data.status === 'queued') {
                                    localTaskStatus = 'queued'; setStatus('queued'); setQueueMsg(data.message); continue;
                                }
                                if (data.status === 'processing') {
                                    localTaskStatus = 'analyzing'; setStatus('analyzing'); setQueueMsg(''); continue;
                                }
                                
                                if (data.progress !== undefined) {
                                    setProgressInfo({ current: data.current_time || 0, total: data.total_duration || 0, percent: data.progress });
                                }
                                
                                if (data.status === 'finished') {
                                    localTaskStatus = 'success'; setStatus('success');
                                    if (appMode === 'student') {
                                        const best = calculateBestMatch(studentCurrentSeq);
                                        setBestMatchResult(best);
                                        if (best) saveStudentScore(best.score);
                                    }
                                    break;
                                }

                                const currentText = data.text || "";
                                const currentRatio = data.pixel_ratio !== undefined ? data.pixel_ratio : null;
                                let isTriggered = false; let displayDetail = ""; let milestoneValue = "";

                                if (analysisEngine === 'motion' && currentRatio !== null) {
                                    let isMoving = currentRatio >= stateSensitivity;
                                    let currentStateStr = isMoving ? "旋轉中" : "靜止";
                                    
                                    if (lastRatioValue === null) {
                                        lastRatioValue = currentStateStr;
                                    } else if (lastRatioValue !== currentStateStr) {
                                        isTriggered = true;
                                        displayDetail = `畫面變動率: ${currentRatio}% ➡️ ${currentStateStr}`;
                                        milestoneValue = `馬達狀態:${currentStateStr}`;
                                        lastRatioValue = currentStateStr;
                                    }
                                }
                                else if (analysisEngine === 'state' && currentRatio !== null) {
                                    if (lastRatioValue === null) lastRatioValue = currentRatio;
                                    else {
                                        const delta = Math.abs(currentRatio - lastRatioValue);
                                        if (delta >= stateSensitivity) {
                                            isTriggered = true;
                                            displayDetail = `發光率: ${lastRatioValue}% ➡️ ${currentRatio}%`;
                                            milestoneValue = `狀態變更(充填率:${currentRatio}%)`;
                                            lastRatioValue = currentRatio;
                                        }
                                    }
                                } 
                                else if ((analysisEngine === 'ocr' || analysisEngine === 'color') && currentText) {
                                    if (currentText !== lastTextValue) {
                                        isTriggered = true;
                                        displayDetail = `[ ${lastTextValue || '無'} ] ➡️ [ ${currentText} ]`;
                                        milestoneValue = currentText; lastTextValue = currentText;
                                    }
                                }

                                if (isTriggered) {
                                    let actualValueToStore = milestoneValue;
                                    if (strictMode && (analysisEngine === 'ocr' || analysisEngine === 'color')) {
                                        actualValueToStore = currentText;
                                    }

                                    let ruleTag = appMode === 'teacher' ? `📌 錄製為新特徵` : `🔵 擷取動作 (${studentCurrentSeq.length + 1})`;
                                    let ruleColor = appMode === 'teacher' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-slate-50 text-slate-600 border-slate-300 shadow-sm';
                                    
                                    if (appMode === 'student') {
                                        studentCurrentSeq.push(actualValueToStore);
                                        setStudentSequence([...studentCurrentSeq]);
                                    }
                                    
                                    historyList.push({
                                        time: data.time.toFixed(1),
                                        detail: displayDetail,
                                        raw_snapshot: milestoneValue,
                                        rule_tag: ruleTag,
                                        rule_color: ruleColor
                                    });
                                    setResultHistory([...historyList]);
                                }
                            } catch (e) {
                                console.error("資料流解析異常:", e, line);
                            }
                        }
                    }

                    if (appMode === 'teacher') {
                        const newTemplate = historyList.map(h => strictMode ? (analysisEngine === 'ocr' ? h.detail.split('➡️ [ ')[1].replace(' ]','') : h.raw_snapshot) : h.raw_snapshot);
                        
                        if (newTemplate.length > 0) {
                            try {
                                if (user && window.fbInstances && currentTask) {
                                    const { db, doc, setDoc } = window.fbInstances;
                                    const taskRef = doc(db, 'VisionClassrooms', classCode.trim(), 'Tasks', currentTask);
                                    
                                    const updatedPool = [...templatePool, newTemplate];
                                    const serializedPool = updatedPool.map(t => JSON.stringify(t));
                                    
                                    await setDoc(taskRef, {
                                        templates: serializedPool,
                                        engine: analysisEngine,
                                        sensitivity: stateSensitivity,
                                        strictMode: strictMode,
                                        config: config,
                                        roi: roi,
                                        updatedAt: new Date().toISOString()
                                    });
                                    
                                    setTemplatePool(updatedPool);
                                    setTimeout(() => alert(`🎉 訓練資料已新增至「${currentTask}」題庫！\n目前已收集 ${updatedPool.length} 組容錯特徵。`), 400);
                                }
                            } catch (err) {
                                console.error("Firebase 寫入失敗", err);
                                setErrorMessage("⚠️ 雲端連線失敗，無法儲存範本。");
                                localTaskStatus = 'error';
                                setStatus('error');
                            }
                        } else {
                            if (analysisEngine === 'motion') {
                                setErrorMessage("⚠️ 影片中沒有偵測到轉動，未新增至題庫。\n💡 解法：請將綠色方框精準對齊馬達的扇葉，並確認靈敏度設為 2.0% 左右。");
                            } else {
                                setErrorMessage("⚠️ 影片中沒有偵測到變化，因此未新增至題庫。");
                            }
                            localTaskStatus = 'error';
                            setStatus('error');
                        }
                    }

                } catch (error) {
                    if (error.name !== 'AbortError') {
                        setErrorMessage("網路連線被切斷。這通常是因為後端當機或排隊逾時。");
                        localTaskStatus = 'error'; setStatus('error');
                    } else { localTaskStatus = 'idle'; setStatus('idle'); }
                } finally {
                    abortControllerRef.current = null;
                    if (localTaskStatus !== 'success' && localTaskStatus !== 'error' && localTaskStatus !== 'queued' && localTaskStatus !== 'analyzing') setStatus('idle');
                }
            };

            return (
                <div className="w-full h-full flex flex-col lg:flex-row gap-4 pb-2 p-2 md:p-4 relative">
                    
                    {/* 🌟 GAS Classroom 彈窗 */}
                    {showGasModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex justify-center items-center backdrop-blur-sm animate-fadeIn">
                            <div className="bg-white rounded-2xl shadow-2xl w-[600px] max-w-[90vw] overflow-hidden flex flex-col max-h-[85vh]">
                                <div className="flex justify-between items-center bg-emerald-600 p-4">
                                    <h3 className="font-bold text-lg text-white flex items-center gap-2">
                                        <i className="fa-solid fa-chalkboard-user"></i> {gasIntent === 'batch_sync' ? '選擇要同步成績的作業' : '瀏覽 Classroom 作業'}
                                    </h3>
                                    <button onClick={() => { setShowGasModal(false); setGasIntent('load_videos'); }} className="text-emerald-100 hover:text-white transition"><i className="fa-solid fa-times text-2xl"></i></button>
                                </div>
                                <div className="p-3 bg-emerald-50 text-sm border-b border-emerald-200 flex flex-col gap-2 relative">
                                    <div className="flex items-center text-emerald-800 font-bold overflow-x-auto whitespace-nowrap custom-scrollbar pb-1 pr-24">
                                        <button onClick={loadGasCourses} className="hover:text-emerald-600 transition flex items-center"><i className="fa-solid fa-house mr-1"></i>我的課程</button>
                                        {gasStep === 'assignments' && (
                                            <>
                                                <span className="mx-2 text-slate-400">/</span>
                                                <span className="text-emerald-700 truncate">{gasCurrentCourse?.name}</span>
                                            </>
                                        )}
                                    </div>
                                    <button onClick={() => window.open(`${GAS_URL}?action=auth`, '_blank')} className="absolute right-3 top-3 text-[10px] bg-white text-emerald-700 border border-emerald-300 px-2 py-1 rounded font-bold hover:bg-emerald-100 transition shadow-sm">
                                        <i className="fa-solid fa-key"></i> 先進行授權
                                    </button>
                                </div>
                                <div className="p-4 overflow-y-auto custom-scrollbar flex-grow space-y-2 min-h-[300px]">
                                    {gasLoading ? (
                                        <div className="flex justify-center items-center py-12 text-emerald-600 flex-col gap-3">
                                            <div className="loader border-t-emerald-600"></div>
                                            <span className="font-bold">{gasLoadingText}</span>
                                        </div>
                                    ) : gasStep === 'courses' ? (
                                        gasCourses.map(c => (
                                            <button key={c.id} onClick={() => loadGasAssignments(c)} className="w-full text-left p-4 border rounded-xl hover:bg-emerald-50 bg-white shadow-sm transition">
                                                <div className="font-bold text-slate-800 text-lg">{c.name}</div>
                                            </button>
                                        ))
                                    ) : (
                                        gasAssignments.map(a => (
                                            <button key={a.id} onClick={() => loadGasSubmissions(a)} className="w-full text-left p-3 border rounded-xl hover:bg-emerald-50 bg-white shadow-sm transition">
                                                <div className="font-bold text-slate-700 truncate">{a.title}</div>
                                            </button>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}


                    {/* --- 左欄：控制面板 --- */}
                    <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-5 flex flex-col w-full lg:w-[32%] h-auto lg:h-full overflow-y-auto shrink-0 custom-scrollbar">
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-lg font-bold text-slate-800">跨模態檢核控制台</h2>
                            <div className="flex items-center gap-2 bg-slate-50 px-2 py-1 rounded-full border border-slate-200 shadow-sm">
                                <div className={`w-2 h-2 rounded-full ${backendStatus === 'online' ? 'bg-emerald-500' : 'bg-rose-500'}`}></div>
                                <span className="text-[9px] font-bold text-slate-600">運算核心: {backendStatus === 'online' ? '已連線' : '斷線'}</span>
                            </div>
                        </div>

                        {/* 身分與功能切換 */}
                        <div className="flex bg-slate-100 p-1 rounded-xl mb-4 shadow-inner shrink-0 gap-1">
                            <button onClick={() => handleModeSwitch('teacher')} className={`flex-1 py-2 text-[13px] md:text-sm font-bold rounded-lg transition-all ${appMode === 'teacher' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>👨‍🏫 教師建檔</button>
                            <button onClick={() => handleModeSwitch('student')} className={`flex-1 py-2 text-[13px] md:text-sm font-bold rounded-lg transition-all ${appMode === 'student' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>👨‍🎓 學生評量</button>
                            <button onClick={() => setShowScoreModal(true)} className={`flex-1 py-2 text-[13px] md:text-sm font-bold rounded-lg transition-all text-indigo-600 hover:bg-indigo-50`}>📊 成績查詢</button>
                        </div>

                        {/* 教室設定艙 */}
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4 shrink-0">
                            <h3 className="font-bold text-xs text-slate-700 mb-3 flex justify-between items-center">
                                <span>🏫 虛擬教室與關卡設定</span>
                            </h3>
                            <div className="mb-3">
                                <label className="block text-[10px] font-bold text-slate-500 mb-1">課程房間代碼 (跨電腦同步金鑰)</label>
                                <input type="text" value={classCode} onChange={(e) => setClassCode(e.target.value)} placeholder="例: yssu" className="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-mono focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"/>
                            </div>
                            <div className="mb-1">
                                <label className="block text-[10px] font-bold text-slate-500 mb-1">當前測驗關卡 (題庫)</label>
                                <div className="flex gap-2">
                                    <select value={currentTask} onChange={(e) => setCurrentTask(e.target.value)} className="flex-1 bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-sm font-bold focus:outline-none focus:border-indigo-500">
                                        {taskList.length === 0 && <option value="" disabled>-- 目前無任何關卡 --</option>}
                                        {taskList.map((task, i) => <option key={i} value={task}>{task}</option>)}
                                    </select>
                                    {appMode === 'teacher' && (
                                        <button onClick={() => setIsAddingTask(!isAddingTask)} className={`px-3 py-1.5 rounded-lg font-bold text-xs transition-colors ${isAddingTask ? 'bg-slate-200 text-slate-600' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                                            {isAddingTask ? '取消' : '➕ 新增'}
                                        </button>
                                    )}
                                </div>
                            </div>
                            {appMode === 'teacher' && isAddingTask && (
                                <div className="mt-2 flex gap-2 animate-fadeIn">
                                    <input type="text" value={newTaskName} onChange={(e) => setNewTaskName(e.target.value)} placeholder="輸入新關卡名稱 (例: LED閃爍實作)" className="flex-1 bg-white border border-indigo-200 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-indigo-500"/>
                                    <button onClick={handleAddTask} className="bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-600">確定</button>
                                </div>
                            )}
                        </div>

                        {/* 題庫狀態 (老師) */}
                        {appMode === 'teacher' && (
                            <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 mb-4 flex justify-between items-start shrink-0">
                                <div className="w-full">
                                    <div className="flex justify-between items-center mb-1">
                                        <h4 className="font-bold text-xs text-blue-800">📚 本關目前題庫數量</h4>
                                        <button onClick={() => setShowClearConfirm(true)} disabled={templatePool.length === 0} className={`text-[10px] px-2 py-1 rounded font-bold transition shadow-sm ${templatePool.length === 0 ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-rose-500 text-white hover:bg-rose-600'}`}>
                                            清空題庫
                                        </button>
                                    </div>
                                    <p className="text-[10px] text-blue-600 mb-2">已收集 <span className="font-bold text-lg">{templatePool.length}</span> 種正確特徵</p>
                                    
                                    {templatePool.length > 0 && (
                                        <details className="text-[10px] bg-white rounded border border-blue-100 p-2 cursor-pointer outline-none">
                                            <summary className="font-bold text-blue-700 hover:text-blue-900 transition">👀 查看雲端範本內容</summary>
                                            <div className="mt-2 space-y-1 max-h-32 overflow-y-auto custom-scrollbar">
                                                {templatePool.map((seq, idx) => (
                                                    <div key={idx} className="bg-slate-50 p-1 rounded font-mono text-slate-600 break-all">
                                                        <span className="font-bold text-blue-500">[{idx+1}]</span> {JSON.stringify(seq)}
                                                    </div>
                                                ))}
                                            </div>
                                        </details>
                                    )}
                                </div>
                            </div>
                        )}

                        <div className="space-y-4 flex-1 flex flex-col">
                            {/* 學號輸入 (學生手動上傳時才顯示) */}
                            {appMode === 'student' && classroomSubmissions.length === 0 && (

                        <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 animate-fadeIn">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center">
                                <div className="mx-auto w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center text-rose-500 mb-4"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></div>
                                <h3 className="font-bold text-lg text-slate-800 mb-2">確認清空題庫？</h3>
                                <p className="text-sm text-slate-500 mb-6">您即將清空「<span className="font-bold text-rose-500">{currentTask}</span>」的所有訓練範本，此操作無法復原。</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowClearConfirm(false)} className="flex-1 py-2 rounded-lg font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">取消</button>
                                    <button onClick={clearTemplatePool} className="flex-1 py-2 rounded-lg font-bold bg-rose-500 text-white hover:bg-rose-600 transition shadow-sm">確定清空</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 🌟 老師專用：班級成績查詢 Modal 彈窗 */}
                    {showScoreModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 animate-fadeIn">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[80vh]">
                                <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-lg text-slate-800">📊 班級成績查詢 - {currentTask}</h3>
                                    <button onClick={() => setShowScoreModal(false)} className="text-slate-400 hover:text-rose-500 transition-colors bg-white rounded-full p-1 shadow-sm">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                                    </button>
                                </div>
                                <div className="p-4 flex gap-2 border-b border-slate-100 bg-slate-50/50">
                                    <select value={queryClass} onChange={e => setQueryClass(e.target.value)} className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 font-mono bg-white">
                                        <option value="" disabled>請選擇班級</option>
                                        {["701", "702", "703", "704", "705", "706", "707", "708", "709", "710", "711", "712"].map(cls => (
                                            <option key={cls} value={cls}>{cls}</option>
                                        ))}
                                    </select>
                                    <button onClick={handleQueryScores} className="bg-indigo-600 text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-indigo-700 transition shadow-sm">查詢</button>
                                    {classScores.length > 0 && (
                                        <button 
                                            onClick={() => { setGasIntent('batch_sync'); loadGasCourses(); }} 
                                            className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-emerald-700 transition shadow-sm flex items-center gap-2"
                                            title="將目前查詢到的成績批次寫回 Classroom"
                                        >
                                            <i className="fa-solid fa-cloud-arrow-up"></i> 批次同步 Classroom
                                        </button>
                                    )}
                                </div>
                                <div className="p-0 flex-1 overflow-y-auto bg-white custom-scrollbar">
                                    {isQuerying ? (
                                        <div className="py-12 flex flex-col justify-center items-center text-indigo-600 gap-3">
                                            <div className="loader border-t-indigo-600"></div>
                                            <span className="font-bold text-sm">正在從 Firebase 抓取全班成績...</span>
                                        </div>
                                    ) : classScores.length === 0 ? (
                                        <div className="py-12 text-center text-slate-400 text-sm">
                                            {queryClass ? `目前找不到 ${queryClass} 班在「${currentTask}」的任何成績紀錄。` : "請在上方選擇班級並點擊查詢，系統將顯示本關卡的最高分紀錄。"}
                                        </div>
                                    ) : (
                                        <table className="w-full text-left text-sm">
                                            <thead className="bg-slate-100 text-slate-500 text-xs uppercase sticky top-0 shadow-sm">
                                                <tr><th className="px-6 py-3 font-bold">座號</th><th className="px-6 py-3 font-bold">學號</th><th className="px-6 py-3 font-bold">最佳成績</th><th className="px-6 py-3 font-bold">最後更新時間</th></tr>
                                            </thead>
                                            <tbody>
                                                {classScores.map((score, idx) => (
                                                    <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                        <td className="px-6 py-3 font-bold text-slate-700">{score.number}</td>
                                                        <td className="px-6 py-3 font-mono text-slate-500">{score.studentId}</td>
                                                        <td className="px-6 py-3">
                                                            <span className={`font-bold px-2.5 py-1 rounded-full text-xs ${score.score >= 90 ? 'bg-emerald-100 text-emerald-700' : score.score >= 75 ? 'bg-blue-100 text-blue-700' : 'bg-rose-100 text-rose-700'}`}>
                                                                {score.score} 分
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-3 text-[10px] text-slate-400">
                                                            {score.updatedAt ? new Date(score.updatedAt).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '無時間紀錄'}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
