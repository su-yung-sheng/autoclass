    <script>
        const API_URL = "https://flanking-snort-cyclic.ngrok-free.dev";
        const GAS_URL = "https://script.google.com/a/macros/mail.qfm.kh.edu.tw/s/AKfycbydRpN2hbYelUy9sAvTYh26JlK_DBpA5NrAN-jmepXRjG4oBnGy4TTT2NWktLK4JdzSyA/exec";
        
        let gasCurrentCourseId = null;
        let gasCurrentCourseWorkId = null;
        let gasModalCaller = null; 
        let currentImageFiles = []; 
        let jsonpCounter = 0;

        const ocrDictionaries = {
            "ct_01": {
                name: "運算思維01", required: ["挑戰成功"],
                levels: [
                    { name: "重排積木", keywords: ["重排積木", "stacked", "jenga"] },
                    { name: "寶箱開鎖", keywords: ["寶箱開鎖", "treasure", "unlock"] },
                    { name: "畢業手鍊", keywords: ["畢業手鍊", "graduation", "bracelet"] },
                    { name: "彙整遊戲卡", keywords: ["彙整遊戲卡", "collecting", "point", "card"] },
                    { name: "班級出遊", keywords: ["班級出遊", "colories", "dessert"] },
                    { name: "夜市射氣球", keywords: ["夜市射氣球", "nightmarket", "balloon"] },
                    { name: "團隊攀岩", keywords: ["團隊攀岩", "teamrock", "climbing"] },
                    { name: "誰的帽子", keywords: ["誰的帽子", "whose", "hat"] }
                ]
            },
            "ct_02": {
                name: "運算思維02", required: ["挑戰成功"],
                levels: [
                    { name: "點心時間", keywords: ["點心時間", "snack", "time"] },
                    { name: "地圖著色", keywords: ["地圖著色", "map", "coloring"] },
                    { name: "收拾玩具球", keywords: ["收拾玩具球", "packaging", "toys"] },
                    { name: "萬聖尋糖趣", keywords: ["萬聖尋糖趣", "halloween", "candy"] },
                    { name: "行李機器人", keywords: ["行李機器人", "luggage", "robot"] },
                    { name: "彈珠軌道", keywords: ["彈珠軌道", "marble", "track"] },
                    { name: "單人搶糖", keywords: ["單人搶糖", "candy", "game"] },
                    { name: "變形數獨", keywords: ["變形數獨", "sudoku", "variant"] }
                ]
            },
            "ct_03": {
                name: "運算思維03", required: ["挑戰成功"],
                levels: [
                    { name: "跳格子", keywords: ["跳格子", "number", "hopscotch"] },
                    { name: "任意門", keywords: ["任意門", "dokodemo", "door"] },
                    { name: "滑梯公園", keywords: ["滑梯公園", "slide", "park"] },
                    { name: "水餃工廠", keywords: ["水餃工廠", "portioned", "dumplings"] },
                    { name: "無括號計算機", keywords: ["無括號計算機", "bracketless", "calculator"] },
                    { name: "遊覽車共乘", keywords: ["遊覽車共乘", "bus", "sharing"] },
                    { name: "扭蛋轉轉樂", keywords: ["扭蛋轉轉樂", "spinning", "gacha"] },
                    { name: "換零錢機", keywords: ["換零錢機", "exchange", "machine"] },
                    { name: "打地鼠", keywords: ["打地鼠", "whac", "mole"] },
                    { name: "拔蘿蔔", keywords: ["拔蘿蔔", "carrot", "harvest"] }
                ]
            },
            "ct_04": {
                name: "運算思維04", required: ["挑戰成功"],
                levels: [
                    { name: "智慧選卡", keywords: ["智慧選卡", "card", "search"] },
                    { name: "必勝棋局", keywords: ["必勝棋局", "winnable", "chess"] },
                    { name: "變數謎題", keywords: ["變數謎題", "variable", "puzzle"] },
                    { name: "遊園專車", keywords: ["遊園專車", "amusement", "park", "bus"] },
                    { name: "智慧圓環", keywords: ["智慧圓環", "enter", "ring"] },
                    { name: "烤車輪餅", keywords: ["烤車輪餅", "grilled", "wheel", "pie"] },
                    { name: "合作學習", keywords: ["合作學習", "cooperative", "learning"] },
                    { name: "校慶點心", keywords: ["校慶點心", "school", "anniversary"] },
                    { name: "夾娃娃機", keywords: ["夾娃娃機", "claw", "machine"] },
                    { name: "兌領福袋", keywords: ["兌領福袋", "blind", "box", "exchange"] }
                ]
            }
        };

        function escapeHTML(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>'"]/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[match];
            });
        }

        function fetchJSONP(url) {
            return new Promise((resolve, reject) => {
                const callbackName = 'jsonp_cb_' + Date.now() + '_' + (jsonpCounter++);
                const script = document.createElement('script');
                const timeoutId = setTimeout(() => { cleanup(); reject(new Error("請求超時。")); }, 30000);
                function cleanup() { delete window[callbackName]; if (script.parentNode) document.body.removeChild(script); }
                window[callbackName] = function(data) { clearTimeout(timeoutId); cleanup(); resolve(data); };
                const sep = url.includes('?') ? '&' : '?';
                script.src = `${url}${sep}callback=${callbackName}`;
                script.onerror = function() { clearTimeout(timeoutId); cleanup(); reject(new Error("無法連線至 GAS。")); };
                document.body.appendChild(script);
            });
        }

        function customAlert(message, type = 'info') {
            return new Promise(resolve => {
                const modal = document.getElementById('customModal');
                const icon = document.getElementById('customModalIcon');
                const title = document.getElementById('customModalTitle');
                const msg = document.getElementById('customModalMessage');
                const actions = document.getElementById('customModalActions');

                if (type === 'error') { icon.innerHTML = '<i class="fa-solid fa-circle-xmark text-red-500"></i>'; title.innerText = '未通過檢測'; } 
                else if (type === 'success') { icon.innerHTML = '<i class="fa-solid fa-circle-check text-green-500"></i>'; title.innerText = '通過檢測'; } 
                else { icon.innerHTML = '<i class="fa-solid fa-circle-info text-blue-500"></i>'; title.innerText = '系統提示'; }
                msg.innerText = message;
                actions.innerHTML = `<button id="customAlertBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg transition">確定</button>`;
                modal.classList.remove('hidden');
                document.getElementById('customAlertBtn').onclick = () => { modal.classList.add('hidden'); resolve(true); };
            });
        }

        function closeGasFileModal() { document.getElementById('gasFileModal').classList.add('hidden'); }
        function authorizeGas() { window.open(`${GAS_URL}?action=auth`, '_blank'); }
        function showGasLoading(text) { document.getElementById('gasLoading').classList.replace('hidden', 'flex'); document.getElementById('gasFileList').innerHTML = ''; document.getElementById('gasLoadingText').innerText = text; }
        function hideGasLoading() { document.getElementById('gasLoading').classList.replace('flex', 'hidden'); }
        function updateGasBreadcrumb(html) { document.getElementById('gasBreadcrumbs').innerHTML = `<button onclick="loadGasCourses()" class="hover:text-green-600 transition flex items-center"><i class="fa-solid fa-house mr-1"></i>我的課程</button> ${html}`; }

        async function loadGasCourses(caller) {
            if(caller) gasModalCaller = caller; 
            document.getElementById('gasFileModal').classList.remove('hidden');
            showGasLoading("正在讀取 Classroom 課程清單...");
            updateGasBreadcrumb("");
            try {
                const data = await fetchJSONP(`${GAS_URL}?action=getCourses`);
                if(data.status === 'error') throw new Error(data.message);
                let html = '';
                data.courses.forEach(c => {
                    html += `<button onclick="loadGasAssignments('${c.id}', '${escapeHTML(c.name)}')" class="w-full text-left p-4 border rounded-lg hover:bg-green-50 bg-white shadow-sm mb-2"><div class="font-bold text-gray-800 text-lg">${escapeHTML(c.name)}</div></button>`;
                });
                document.getElementById('gasFileList').innerHTML = html;
            } catch (err) {
                document.getElementById('gasFileList').innerHTML = `<div class="text-red-500 p-4">課程讀取失敗。</div>`;
            } finally { hideGasLoading(); }
        }

        async function loadGasAssignments(courseId, courseName) {
            showGasLoading(`正在讀取「${courseName}」的作業清單...`);
            updateGasBreadcrumb(`<span class="mx-2 text-gray-400">/</span> <span class="text-green-700 truncate">${courseName}</span>`);
            gasCurrentCourseId = courseId;
            try {
                const data = await fetchJSONP(`${GAS_URL}?action=getAssignments&courseId=${courseId}`);
                if(data.status === 'error') throw new Error(data.message);
                let html = '';
                data.assignments.forEach(a => {
                    html += `<button onclick="handleGasAssignmentSelect('${courseId}', '${a.id}', '${escapeHTML(a.title)}')" class="w-full text-left p-3 border rounded-lg hover:bg-blue-50 bg-white shadow-sm mb-2"><div class="font-bold text-gray-700 truncate">${escapeHTML(a.title)}</div></button>`;
                });
                document.getElementById('gasFileList').innerHTML = html;
            } catch (err) {
                document.getElementById('gasFileList').innerHTML = `<div class="text-red-500 p-4">作業讀取失敗。</div>`;
            } finally { hideGasLoading(); }
        }

        function handleGasAssignmentSelect(courseId, assignId, assignName) {
            fetchImageSubmissions(courseId, assignId, assignName);
        }

        async function fetchImageSubmissions(courseId, assignId, assignName) {
            showGasLoading("正在讀取繳交名單...");
            try {
                const data = await fetchJSONP(`${GAS_URL}?action=getSubmissions&courseId=${courseId}&courseWorkId=${assignId}`);
                if(data.status === 'error') throw new Error(data.message);
                closeGasFileModal();
                document.getElementById('imageWorkspace').classList.remove('hidden');
                document.getElementById('imageWorkspace').classList.add('flex');
                document.getElementById('imageAssignmentName').innerText = assignName;

                const allFiles = data.files || [];
                currentImageFiles = allFiles.filter(f => /\.(png|jpg|jpeg|gif)$/i.test(f.name));
                document.getElementById('imageStudentCount').innerText = `${currentImageFiles.length} 份`;

                let html = '';
                if(currentImageFiles.length === 0) {
                    html = '<p class="text-center text-gray-400 py-8">找不到圖片類型的繳交作品</p>';
                } else {
                    document.getElementById('imageGradeAllContainer').classList.remove('hidden');
                    currentImageFiles.forEach((file, index) => {
                        html += `<button id="img-btn-${index}" onclick="gradeImageStudent('${file.id}', '${file.submissionId}', '${escapeHTML(file.name)}', 'img-btn-${index}')" class="w-full text-left p-3 border rounded-lg hover:border-emerald-400 transition bg-white shadow-sm relative overflow-hidden mb-2"><div class="font-bold text-slate-700 text-sm truncate">${escapeHTML(file.name)}</div><div id="img-score-${index}" class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-bold text-gray-300">未辨識</div></button>`;
                    });
                }
                document.getElementById('imageStudentList').innerHTML = html;
            } catch(e) {
                customAlert("載入繳交名單失敗。");
            } finally { hideGasLoading(); }
        }

        async function handleManualImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            document.getElementById('imageFileNameDisplay').innerText = file.name;
            document.getElementById('imageWorkspace').classList.remove('hidden');
            document.getElementById('imageWorkspace').classList.add('flex');
            document.getElementById('imageEmptyResultArea').classList.add('hidden');
            document.getElementById('imageResultArea').classList.add('hidden');
            
            const loading = document.getElementById('imageEvalLoading');
            loading.classList.remove('hidden');

            try {
                const objectUrl = URL.createObjectURL(file);
                document.getElementById('imageWorkspacePreview').src = objectUrl;
                
                const formData = new FormData();
                formData.append('file', file, file.name);

                const response = await fetch(`${API_URL}/analyze`, { method: 'POST', headers: {'ngrok-skip-browser-warning': 'true'}, body: formData });
                if (!response.ok) throw new Error("無法連線至後端 OCR 伺服器");
                const result = await response.json();

                const rawTexts = result.raw_text || [];
                const fullTextStr = rawTexts.join('\n').toLowerCase();
                let isPass = false;
                let passReason = "未通過檢測";

                const selectedVal = document.getElementById('ocrLevelSelect').value;
                if (selectedVal === "") {
                    const passKeywords = ['挑戰成功', '過關', '通關', 'success'];
                    isPass = passKeywords.some(kw => fullTextStr.includes(kw.toLowerCase()));
                    passReason = isPass ? "通過：符合通關字眼" : "未通過檢測";
                } else {
                    const [catKey, levelIdx] = selectedVal.split('-');
                    const category = ocrDictionaries[catKey];
                    const level = category.levels[parseInt(levelIdx)];
                    const hasRequired = category.required.some(req => fullTextStr.includes(req.toLowerCase()));
                    const hasKeyword = level.keywords.some(kw => fullTextStr.includes(kw.toLowerCase()));
                    
                    if (hasRequired && hasKeyword) {
                        isPass = true;
                        passReason = `符合【${category.name} - ${level.name}】`;
                    } else {
                        passReason = "未通過：不符合關卡特徵關鍵字";
                    }
                }

                document.getElementById('imageResultStudentName').innerText = `本機檔案：${file.name}`;
                const statusBadge = document.getElementById('imageEvalStatus');
                if (isPass) {
                    statusBadge.className = 'px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-100 text-emerald-700 border border-emerald-200';
                    statusBadge.innerHTML = '🟢 標準通關';
                } else {
                    statusBadge.className = 'px-4 py-1.5 rounded-full text-sm font-bold bg-rose-100 text-rose-700 border border-rose-200';
                    statusBadge.innerHTML = '🔴 未達標準';
                }
                document.getElementById('imageResultArea').classList.remove('hidden');
                customAlert(passReason, isPass ? 'success' : 'error');
            } catch(e) {
                customAlert("辨識連線失敗。");
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function checkConnection() {
            try {
                await fetch(`${API_URL}/ping`, { method: 'GET', headers: {'ngrok-skip-browser-warning': 'true'} });
                document.getElementById('ocrStatusDot').className = 'w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]';
            } catch(e) {}
        }

        async function checkOcrConnection() {
            try {
                await fetch(`${API_URL}/health`, { method: 'GET', headers: {'ngrok-skip-browser-warning': 'true'} });
                document.getElementById('ocrStatusDot').className = 'w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]';
                document.getElementById('ocrStatusText').innerText = 'OCR 後端連線正常';
            } catch (err) {
                document.getElementById('ocrStatusDot').className = 'w-3 h-3 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]';
                document.getElementById('ocrStatusText').innerText = 'OCR 未連線';
            }
        }
    </script>
</body>
